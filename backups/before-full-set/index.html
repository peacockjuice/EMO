<!doctype html><html lang="ru"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMO</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f2e2b;color:#e8fff7;text-align:center}
h1{margin:18px 0 4px;font-size:26px}p{margin:0 0 14px;opacity:.7;font-size:14px}
#g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:460px;margin:0 auto;padding:0 14px 24px}
button{font-size:18px;padding:18px 6px;border:0;border-radius:16px;background:#1f5a53;color:inherit;touch-action:manipulation}
button span{display:block;font-size:30px;margin-bottom:4px}
button.on{background:#63d6b6;color:#06231f}
#g button:first-child{grid-column:1/3}
</style>
<h1>BMO</h1><p id="s">выбери эмоцию</p><div id="g"></div>
<script>
const M=[["auto","🎲","Сам по себе"],["smile","🙂","Улыбка"],["happy","😄","Радость"],["love","😍","Влюблён"],["wow","😮","Удивление"],["wink","😉","Подмигивает"],["talk","💬","Говорит"],["look","👀","Смотрит по сторонам"],["sad","🙁","Грустит"],["sleep","😴","Спит"]];
const g=document.getElementById("g"),s=document.getElementById("s");
function mark(m){for(const b of g.children)b.className=b.dataset.m==m?"on":""}
async function call(u){try{const r=await fetch(u);const j=await r.json();mark(j.mood);s.textContent="на связи"}catch(e){s.textContent="нет связи с роботом"}}
for(const [m,e,t] of M){const b=document.createElement("button");b.dataset.m=m;b.innerHTML="<span>"+e+"</span>"+t;b.onclick=()=>call("/set?e="+m);g.appendChild(b)}
call("/state");setInterval(()=>call("/state"),3000);
</script></html>
